version: '3.8'

services:

  # ── Laravel App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stmarksms_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: stmarksms
      DB_USERNAME: stmarksms_user
      DB_PASSWORD: stmarksms_pass
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stmarksms_net

  # ── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: stmarksms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stmarksms
      MYSQL_USER: stmarksms_user
      MYSQL_PASSWORD: stmarksms_pass
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"          # 3307 on host so it doesn't clash with local MySQL
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stmarksms_net

  # ── phpMyAdmin (optional DB GUI) ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: stmarksms_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: stmarksms_user
      PMA_PASSWORD: stmarksms_pass
    depends_on:
      - db
    networks:
      - stmarksms_net

volumes:
  db_data:
  storage_data:

networks:
  stmarksms_net:
    driver: bridge
